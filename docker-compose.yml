services:
  engine:
    build:
      context: ./engine
      target: development
    container_name: dollarzing-engine-dev
    volumes:
      - ./engine:/app
      - /app/node_modules
      - dollarzing-data:/data/datasets
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    networks:
      - dollarzing-network
    restart: no
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      target: development
    container_name: dollarzing-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
      - ./engine/generated-datasets:/app/public/engine/generated-datasets:ro
      - /app/node_modules
      - dollarzing-data:/data/datasets
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - VITE_API_URL=http://localhost:3001
      - VITE_DEV_MODE=true
      - VITE_PRESENTATION_MANIFEST_URL=/engine/generated-datasets/anchor-datasets/presentation-manifest.json
      - VITE_PRESENTATION_BASE_URL=/engine/generated-datasets/
    depends_on:
      - engine
    networks:
      - dollarzing-network
    restart: no
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  dollarzing-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  dollarzing-data:
    driver: local
